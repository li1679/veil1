<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veil - 我的邮箱</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/icons/regular.css">
    <link rel="stylesheet" href="/css/icons/bold.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F2F2F7">
    <meta name="color-scheme" content="light dark">
    <script type="module" src="/js/theme.js"></script>
</head>
<body class="page-scroll">
    <div class="mailbox-layout">
        <!-- 顶部栏 -->
        <div class="mailbox-header">
            <div class="user-brand">
                <div class="brand-icon">
                    <i class="ph ph-envelope-simple"></i>
                </div>
                <div class="brand-text">Veil</div>
            </div>

            <div class="mailbox-address" id="mailboxAddress">加载中...</div>

            <div class="header-actions">
                <a href="https://github.com/li1679/veil" class="github-pill" target="_blank" rel="noopener noreferrer">
                    <i class="ph ph-github-logo"></i>
                    <span>GitHub</span>
                </a>
                <button class="btn btn-ghost logout-height" data-command-click="handleLogout">
                    <i class="ph ph-sign-out"></i> 退出
                </button>
            </div>
        </div>

        <!-- 操作栏 -->
        <div class="mailbox-action-row">
            <button class="btn btn-secondary" data-command-click="copyMailbox">
                <i class="ph-bold ph-copy"></i> 复制邮箱
            </button>
            <button class="btn btn-secondary" data-command-click="refreshInbox">
                <i class="ph-bold ph-arrows-clockwise"></i> 刷新收件箱
            </button>
            <button class="btn btn-primary send-action-btn" id="sendMailBtn" data-command-click="openSendModal">
                <i class="ph-bold ph-paper-plane-tilt"></i> 发送邮件
            </button>
        </div>

        <!-- 收件箱 -->
        <div class="mailbox-content">
            <div class="mailbox-inbox">
                <div class="inbox-header">
                    <div class="inbox-title"><span class="status-dot"></span> 收件箱</div>
                    <div class="inbox-summary"><span id="emailCount" class="inbox-caption">加载中…</span><span id="inboxStatus" class="inbox-caption">准备收件</span></div>
                </div>
                <div id="inboxContainer" class="mailbox-inbox-container">
                    <div class="state-block state-loading" aria-live="polite"><i class="ph ph-spinner spinning" aria-hidden="true"></i><span class="state-title">加载中...</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"><i class="ph-bold ph-check"></i> <span id="toastMsg">成功</span></div>

    <div id="sharedOverlays"></div>

    <script type="module" src="/js/mailbox.js"></script>
</body>
</html>
